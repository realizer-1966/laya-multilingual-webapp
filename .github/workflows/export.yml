name: Export multilingual ONNX

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers huggingface_hub onnx onnxruntime onnxscript onnxconverter-common "laya>=0.3.0"

      - name: Export multilingual to ONNX
        run: |
          python laya-ts/scripts/export_onnx.py --repo convaiinnovations/laya --subfolder multilingual --out-dir ./model

      - name: Quantize to INT8 (weight-only dynamic, CPU)
        run: |
          python - <<'PY'
          from onnxruntime.quantization import quantize_dynamic, QuantType
          quantize_dynamic("model/encoder.onnx", "model/encoder.int8.onnx",
                           weight_type=QuantType.QInt8)
          print("encoder quantized OK")
          try:
              quantize_dynamic("model/head.onnx", "model/head.int8.onnx",
                               weight_type=QuantType.QInt8)
              print("head quantized OK")
          except Exception as e:
              print("head quantize skipped:", e)
          PY

      - name: Convert encoder to FP16 (WebGPU path)
        run: |
          python - <<'PY'
          import onnx
          from onnxconverter_common import float16
          from onnx import TensorProto

          m = onnx.load("model/encoder.onnx")  # fp32 (external data 로드됨)
          # Cast를 blocklist에 넣어 torch-export cast 체인이 fp32를 유지하도록 함.
          # shape inference는 ON (그래프가 이미 완전 typed라 불필요) — disable_shape_infer 기본(False)
          m16 = float16.convert_float_to_float16(
              m, keep_io_types=True,
              op_block_list=["Cast", "Softmax", "LogSoftmax", "IsNaN", "Where", "Equal", "Expand"],
          )
          print("converted")

          # 병합 저장 (단일 파일)
          onnx.save(m16, "model/encoder-fp16.onnx")
          import os
          print("encoder-fp16:", os.path.getsize("model/encoder-fp16.onnx"))
          PY

      - name: List artifacts
        run: ls -lh model/

      - uses: actions/upload-artifact@v4
        with:
          name: laya-multilingual-onnx
          path: model/
